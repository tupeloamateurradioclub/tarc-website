<!DOCTYPE html>
<html lang="en" data-theme="light" data-text-size="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post — TARC</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="index.html" class="navbar-brand">
        TARC <span class="callsign">K5TUP</span>
      </a>
      <button class="navbar-hamburger" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <ul class="navbar-nav">
        <li><a href="index.html">News</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="navbar-toggles">
        <button class="toggle-btn" id="theme-toggle" aria-label="Toggle dark mode">
          <span class="theme-icon">&#9789;</span>
        </button>
        <button class="toggle-btn" id="text-size-toggle" aria-label="Toggle large text">
          Aa
        </button>
      </div>
    </div>
  </nav>

  <div class="page-wrapper">
    <main class="page-content">
      <div class="container">
        <a href="index.html" class="read-more">&larr; Back to News</a>
        <article id="post-content" class="mt-lg">
          <p class="text-secondary">Loading post...</p>
        </article>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>&copy; <span id="year"></span> Tupelo Amateur Radio Club — K5TUP</p>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { parseMarkdown, parseFrontMatter } from './js/markdown.js';

    const slug = new URLSearchParams(window.location.search).get('slug');
    const container = document.getElementById('post-content');

    if (slug) {
      try {
        const res = await fetch(`posts/${slug}.md`);
        if (!res.ok) throw new Error('Post not found');
        const text = await res.text();
        const { meta, body } = parseFrontMatter(text);
        if (meta.image) meta.image = meta.image.replace(/^\//, '');

        document.title = `${meta.title} — TARC`;

        const imageHtml = meta.image
          ? `<img src="${meta.image}" alt="${meta.title}" style="border-radius: var(--border-radius); margin-bottom: var(--space-lg);" loading="lazy">`
          : '';

        container.innerHTML = `
          <div class="post-card-meta mb-md">${new Date(meta.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
          <h1>${meta.title}</h1>
          ${imageHtml}
          <div class="mt-lg">${parseMarkdown(body)}</div>
        `;
      } catch (err) {
        container.innerHTML = '<p class="text-secondary">Post not found.</p>';
      }
    } else {
      container.innerHTML = '<p class="text-secondary">Post not found.</p>';
    }
  </script>
</body>
</html>
